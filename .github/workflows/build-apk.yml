name: Build NOVA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools virtualenv
          python -m pip install "cython==0.29.36" buildozer

      - name: Build debug APK
        run: buildozer android debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-apk
          path: bin/*.apk
          if-no-files-found: error
